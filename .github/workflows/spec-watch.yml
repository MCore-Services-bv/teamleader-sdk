name: Specification watch

# Weekly check for a newer @teamleader/focus-api-specification than the one
# pinned in package.json. When there is one, the SDK is audited against it and
# an issue is opened (or updated) with the findings, so a Teamleader API change
# shows up here before it shows up as a bug report. One issue per version.
#
# Nothing is committed: bumping the pin stays a deliberate change —
# `npm install @teamleader/focus-api-specification@<version> --save-exact`,
# `npm run spec:fixtures`, `composer spec:audit`, then fix or baseline.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

# Nothing at workflow level; the one job asks for what it needs.
permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, json, curl

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Compare versions
        id: versions
        run: |
          pinned=$(node -p "require('./package.json').devDependencies['@teamleader/focus-api-specification']")
          latest=$(npm view @teamleader/focus-api-specification version)
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned $pinned, latest $latest"

      - name: Audit against the latest specification
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        id: audit
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          PINNED: ${{ steps.versions.outputs.pinned }}
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          npm ci --ignore-scripts --no-audit --no-fund
          npm install "@teamleader/focus-api-specification@${LATEST}" --no-save --ignore-scripts --no-audit --no-fund
          npm run spec:fixtures
          {
            echo "A newer Teamleader Focus API specification is available: **${LATEST}** (pinned: ${PINNED})."
            echo
            echo "Findings against it that are not in the baseline:"
            echo
            php bin/spec-audit --new
          } > audit.md
          cat audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.versions.outputs.pinned != steps.versions.outputs.latest
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          title="Teamleader API specification ${LATEST} is available"
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')
          # One issue per version: later weekly runs leave it alone.
          if [ -n "$existing" ]; then
            echo "Issue #$existing already tracks ${LATEST}."
          else
            gh issue create --title "$title" --body-file audit.md
          fi
