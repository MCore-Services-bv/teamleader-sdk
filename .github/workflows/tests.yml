name: Tests

on:
  push:
    branches: [ main, develop, 3.x ]
  pull_request:
    branches: [ main, develop, 3.x ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        laravel: [ '12.*', '13.*' ]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl, redis

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-progress --no-interaction --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run Redis tests
        run: vendor/bin/phpunit --group redis
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15

      - name: Run code style checks
        run: vendor/bin/pint --test
        if: matrix.php == '8.4' && matrix.laravel == '13.*'

  specification:
    # Runs once rather than per matrix cell: the checks below compare the SDK
    # with the pinned @teamleader/focus-api-specification and do not depend on
    # the PHP or Laravel version.
    runs-on: ubuntu-latest
    name: Specification parity

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, curl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is not committed; the specification itself is pinned
      # to an exact version in package.json, which is what the fixtures depend on.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          npm install --no-audit --no-fund

      # The committed fixtures must be exactly what the generator produces from
      # the pinned specification. A hand edit, a generator change without a
      # regeneration, or a version bump in package.json without one all fail here.
      - name: Fixtures match the pinned specification
        run: |
          npm run spec:fixtures
          git diff --exit-code -- tests/Fixtures/specification API-list-endpoint-contract.md

      # Fails on any error or warning not in baseline.json, and on any baseline
      # entry that is no longer reported. The summary goes to the job page.
      - name: Specification audit
        run: |
          php bin/spec-audit --summary >> "$GITHUB_STEP_SUMMARY"
          php bin/spec-audit --check

      # docs/reference is generated from the resource classes. A resource that
      # changes without `composer docs:build` being run fails here, so the
      # published reference always describes the code on main.
      - name: API reference matches the code
        run: php bin/docs --check
