# Weekly pull requests for outdated or vulnerable dependencies.
# Actions are pinned to commit SHAs; Dependabot updates the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # A library declares ranges for its users: a new major is added to the
    # range (^7.0 || ^8.0), never put in place of the old one, which would
    # make the SDK uninstallable next to anything still on the old major.
    versioning-strategy: widen
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The specification is bumped deliberately (see spec-watch.yml).
    ignore:
      - dependency-name: "@teamleader/focus-api-specification"
